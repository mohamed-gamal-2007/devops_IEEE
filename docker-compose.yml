services:
  web:
    build: .
    container_name: flask_attendance_app
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - sqlite_data:/app/instance 
    environment:
      - FLASK_ENV=production
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlite_data:

networks:
  app-network:
    driver: bridge