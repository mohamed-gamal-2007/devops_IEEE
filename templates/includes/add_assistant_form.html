<form method="POST" action="{{ url_for('add_assistant') }}">
    <div class="row">
        <div class="col-md-6 mb-3"><input type="text" name="first_name" class="form-control" placeholder="الاسم الأول" required></div>
        <div class="col-md-6 mb-3"><input type="text" name="last_name" class="form-control" placeholder="الاسم الثاني/العائلة" required></div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3"><input type="email" name="email" class="form-control" placeholder="البريد الإلكتروني (للدخول)" required></div>
        <div class="col-md-6 mb-3"><input type="password" name="password" class="form-control" placeholder="كلمة المرور المؤقتة" required></div>
    </div>
    <button type="submit" class="btn btn-info w-100">تسجيل المعيد</button>
</form>
