<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>رقم الجلسة</th>
                <th>اسم المادة</th>
                <th>رمز الجلسة</th>
                <th>المُنشئ</th>
                <th>تاريخ الانتهاء</th>
                <th>عدد الحضور</th>
                <th>تحميل التقرير</th>
            </tr>
        </thead>
        <tbody>
            {% for session in sessions %}
            <tr>
                <td>{{ session.id }}</td>
                <td colspan="7" class="text-center text-muted">لا توجد جلسات منتهية في الأرشيف.</td>
            </tr>
            {% endif %}
        </tbody>
    </table>
</div>
